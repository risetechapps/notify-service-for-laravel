name: Testes

on:
    push:
        branches: [main, develop]
    pull_request:
    workflow_dispatch:

jobs:
    test:
        name: PHP ${{ matrix.php }} - ${{ matrix.stability }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4']
                stability: [prefer-lowest, prefer-stable]

        steps:
            - name: Checkout código
              uses: actions/checkout@v5

            - name: Configurar PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: mbstring, intl
                  coverage: none

            # O pacote não versiona o composer.lock: cada combinação resolve as
            # dependências na hora, da mais antiga aceita à mais nova.
            - name: Instalar dependências
              run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

            # Estilo: preset laravel (o mesmo do .styleci.yml).
            - name: Pint
              if: matrix.php == '8.4' && matrix.stability == 'prefer-stable'
              run: vendor/bin/pint --test

            - name: Rodar a suíte
              run: vendor/bin/pest
